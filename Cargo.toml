[workspace]
members = [
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/cpctx",
]
# MSRV-aware: `cargo update` prefers dependency versions that still build
# with `rust-version` below.
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["llmctx"]
license      = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# async
tokio        = { version = "1",  features = ["full"] }
# HTTP
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# CLI
clap         = { version = "4",  features = ["derive"] }
# serialisation
serde        = { version = "1",  features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
# hashing
sha2         = "0.10"
# clipboard
arboard      = "3"
# logging / tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
# error handling
thiserror    = "1"
anyhow       = "1"
# gitignore walking
ignore       = "0.4"
# Embedded SQLite for the project context store (.llmctx/context.db).
# `bundled` compiles SQLite in, so users never install it separately.
rusqlite     = { version = "0.32", features = ["bundled"] }
# URL parsing for the Ollama host check (already a reqwest dependency).
url          = "2"
# OS randomness for the daemon's per-session auth token.
getrandom    = "0.2"
# Bounded async channel used by llmctx index for streaming file walker
async-channel = "2"
# Windows ADS crate is declared in each crate that uses it (crates/core/Cargo.toml)
# because virtual manifests don't support [target] sections.

